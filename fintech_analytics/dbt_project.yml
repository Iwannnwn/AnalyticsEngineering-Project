name: 'fintech_analytics'
version: '1.0.0'

# dbt profile
profile: 'fintech_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:        
  - "target"
  - "dbt_packages"


# Configuring models
models:
  fintech_analytics:
    staging:
      +schema: fintech_staging
      +materialized: view

    marts:
      +schema: fintech_marts
      +materialized: table
